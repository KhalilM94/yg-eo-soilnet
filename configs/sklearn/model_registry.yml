# sklearn model registry. One entry per model type; only enabled entries are actually trained.
#
# Random seeds: no entry sets random_state directly. Every model type that has one inherits
# RANDOM_SEED from main_config.yml automatically, and the same value seeds the cross-validation
# folds. Add a `random_seed:` key to an entry if you want that one model to use a different seed
# than the rest of the run; only set random_state under `init_args:` if you want to pin one model
# to a fixed seed no matter what RANDOM_SEED is.
#
# multi_target: declares what an entry can do when you're training on SEVERAL targets at once
# (TARGET_COLUMNS in data_spec.yml has more than one entry). Ignored otherwise.
#   native      this model type can be given all targets at once and predicts them all from a
#               single fit - required for it to be used in `MULTI_TARGET_MODE: joint`.
#   per_target  always train one separate model per target for this entry, no matter what
#               MULTI_TARGET_MODE says globally.
#   (absent)    this model type can only ever predict one target at a time; if the global mode is
#               `joint`, it automatically falls back to one-model-per-target instead, with a
#               warning.

PLSRegression:
  enabled: false
  modeltype: "ml"
  import_path: sklearn.cross_decomposition.PLSRegression
  # PLS is a regression method designed to predict several related outputs from shared underlying
  # patterns, so predicting multiple targets at once is a natural fit for it.
  multi_target: native
  params:
    model__n_components: [2, 4, 6, 8, 10, 12, 14, 16, 18]

Ridge:
  enabled: false
  modeltype: "ml"
  import_path: sklearn.linear_model.Ridge
  # A linear model with one column of coefficients per target, fitted together in a single pass.
  multi_target: native
  params:
    model__alpha: [0.01, 0.1, 1, 10, 100, 1000]

XGBoost:
  enabled: false
  modeltype: "ml"
  import_path: xgboost.XGBRegressor
  # XGBoost can predict several targets from one fit. multi_strategy picks how: one_output_per_tree
  # (the default) builds a separate tree per target; multi_output_tree shares tree splits across
  # targets and puts one prediction per target in each leaf instead.
  multi_target: native
  init_args:
    multi_strategy: "multi_output_tree"
    objective: "reg:squarederror"  #"reg:quantileerror"
    # quantile_alpha: [0.5]
    tree_method: "hist"
    # device: "cuda"
  params:
    model__n_estimators: [200]
    model__max_depth: [6, 8] # 3, 4, 5, 6, 7, 8, 9, 10,
    model__learning_rate: [0.05]
    # model__subsample: [0.8]
    # model__reg_alpha: [0, 0.1, 1]
    # model__reg_lambda: [1, 10, 100]
    # model__colsample_bytree: [0.8, 1.0]
    # model__min_child_weight: [1, 5]

TabICL:
  # TabICL is a "foundation model" for tabular data: rather than learning fixed weights ahead of
  # time, it looks at your training rows again every single time it makes a prediction - a
  # technique called "in-context learning", similar in spirit to how a large language model uses
  # examples you give it in a prompt. The first time you run it, it downloads a pretrained
  # checkpoint from HuggingFace, so that first run needs an internet connection and will be slower.
  enabled: false
  modeltype: "ml"
  import_path: tabicl.TabICLRegressor
  # Keep this at 1. Each parallel worker loads its own full copy of the model into memory, so
  # running several at once (e.g. -1, meaning "use every core") can exhaust your RAM very quickly.
  search_n_jobs: 1
  # TabICL is memory-hungry, especially with many features or many training rows, and can be
  # killed by the operating system if it runs out of memory. If that happens, try these in order:
  #   1. offload_mode: "disk" below (already set) - moves the memory-heavy part to disk instead of
  #      keeping it in RAM/GPU memory.
  #   2. Lower batch_size (commented out below) to a small number like 2.
  #   3. Last resort: reduce the number of input features.
  # Don't lower n_estimators to save memory instead - it works, but it changes the fitted model's
  # predictions, so results stop being comparable to earlier runs.
  init_args:
    n_estimators: 8      # how many internal models to average together; fewer = faster but
                          # noisier. 4 is usually enough for a quick comparison.
    # device: left unset on purpose - TabICL then uses the GPU when the machine has one and
    # the CPU when it does not. It has no "auto" setting, and naming a device that is not
    # there fails, so unset is the only choice that works everywhere.
    # batch_size: 2        # lower this if you run out of memory with many features
    offload_mode: "disk"   # move the memory-heavy part to disk rather than RAM/GPU
    disk_offload_dir: "/tmp/tabicl_offload"
  # Deliberately left empty: TabICL isn't meant to be hyperparameter-tuned, so there's nothing to
  # search here. The cross-validation search still runs (to score the single default config).
  params: {}
