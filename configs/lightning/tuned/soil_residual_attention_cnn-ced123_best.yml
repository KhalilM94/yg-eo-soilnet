# Tuned Lightning registry entry, exported from an Optuna study.
#
#   study      : soil_residual_attention_cnn-ced123
#   entry      : soil_residual_attention_cnn
#   trial      : #114 of 152
#   objective  : val_loss = 0.540463 (minimize)
#
# NOTE: that value is the best of many trials, each itself the best epoch of a noisy
# run - a maximum over noise, so it is optimistically biased and a retrain will
# typically fall short of it. `tune.py --rerank-top K` re-runs the shortlist over
# several seeds and reports what a retrain should actually deliver.
#   exported   : 2026-09-13T01:45:12
#   source     : /home/kmisbah/CESBIO/AL_Moutmir/yg-eo-soilnet/configs/lightning/models/soil_residual_attention_cnn.yml
#
# Compare against the MLflow `val_loss` of the retrained run. NOT r2_score or
# r2_test - those are TEST-split R2 in original units after expm1, a different split, a
# different metric and a different space from anything the study optimized.
#
# Values pinned under `fixed:` in the search space are baked in here too - notably
# trainer.max_epochs, which is the tuning budget. Raise it for a final production run if you
# want early stopping, rather than the epoch budget, to decide when to stop.
#
# Exceptions: num_workers, pin_memory, persistent_workers are restored from the source
# registry. They are throughput knobs that change no result, so production keeps its own.
#
# Train it with:
#   LIGHTNING_MODEL_REGISTRY_PATH=configs/lightning/tuned/soil_residual_attention_cnn-ced123_best.yml python main.py
soil_residual_attention_cnn:
  modeltype: dl
  trainer_args:
    max_epochs: 100
    accelerator: cuda
    devices: 1
    precision: 32-true
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0
    log_every_n_steps: 5
    enable_checkpointing: true
    deterministic: true
  callbacks:
    early_stopping:
      monitor: val_loss
      mode: min
      patience: 12
    checkpoint:
      monitor: val_loss
      mode: min
      save_top_k: 1
  datamodule_init_args:
    batch_size: 64
    target_transform: log1p
    num_workers: 11
    pin_memory: false
    persistent_workers: true
    shuffle: true
    max_sequence_length: null
  tags:
    framework: lightning
    family: regression
    architecture: residual-calendar-grid-cnn-attention
  enabled: true
  input_kind: sequence
  import_path: yg_eo_soilnet.models.lightningmodules.soil_cnn_lightning_module.SoilCNNLightningModule
  datamodule_import_path: yg_eo_soilnet.datamodules.sequence.sequence_datamodule.SoilSequenceDataModule
  init_args:
    static_dim: auto
    target_dim: auto
    modality_dims: auto
    grid_years: auto
    # The architecture switches (see configs/lightning/models/soil_cnn.yml). Set to what trial #114
    # ran with: attention fusion, anchored on the residual base below. Each switch's own settings
    # further down are ignored while it is off.
    #   residual_enabled   false predicts the value itself instead of a correction to
    #                      residual_base_columns; true needs a base column for EVERY target fitted
    #   auxiliary_enabled  true feeds the lab values listed in auxiliary_label_columns as extra
    #                      inputs; with that list empty, as tuned, it changes nothing
    fusion: attention
    residual_enabled: true
    auxiliary_enabled: false
    categorical_cardinalities: auto
    categorical_vocabularies: auto
    categorical_feature_names: auto
    embedding_dims: auto
    embedding_max_dim: 50
    embedding_dropout: 0.2
    continuous_norm: layer
    temporal_encoder: dilated_tempcnn
    cnn_hidden_dims:
    - 32
    - 32
    - 32
    modality_embed_dim: 32
    cnn_norm: group
    pool: masked_avg
    month_positional: false
    use_validity_channels: true
    attention_static_tokens: summary
    attention_d_model: 128
    attention_nhead: 8
    attention_num_layers: 1
    attention_ff_multiplier: 2
    attention_dropout: 0.1
    attention_readout: mean
    residual_base_columns:
      organic_matter_g_kg: organic_matter_g_kg_base
      clay_pct: clay_median_0_30cm
      sand_pct: sand_median_0_30cm
      c_e_c_meq_100g: c_e_c_meq_100g__TabICL
      caco3_pct_total: caco3_pct_total__TabICL
      ph_water: ph_median_0_30cm
    residual_base_hidden_dims: []
    residual_base_dropout: 0.2
    residual_base_validity_channels: false
    residual_base_max_missing: 0.05
    auxiliary_label_mean: auto
    auxiliary_label_scale: auto
    auxiliary_label_columns: 
    # - clay_median_0_30cm
    # - sand_median_0_30cm
    # - ph_median_0_30cm
    # - c_e_c_meq_100g__TabICL
    auxiliary_available_names: auto
    auxiliary_validity_channels: true
    auxiliary_hidden_dims: []
    auxiliary_dropout: 0.5
    coord_dim: auto
    harmonic_num_frequencies: 6
    harmonic_include_input: true
    harmonic_hidden_dims: []
    harmonic_dropout: 0.0
    static_hidden_dims:
    - 64
    head_hidden_dims:
    - 64
    head_norm_final: true
    dropout: 0.6
    loss_name: mse
    huber_delta: 1.0
    loss_base: mse
    loss_lambda: 0.1
    loss_shrinkage: 0.05
    loss_min_batch: 16
    cosine_space: original
    learning_rate: 0.0009206444701361331
    temporal_enabled: true
    optimizer_name: adamw
    weight_decay: 0.00027958807557824743
    scheduler_type: plateau
    scheduler_factor: 0.5
    scheduler_patience: 8
    scheduler_min_lr: 1.0e-06
    scheduler_monitor: val_loss
