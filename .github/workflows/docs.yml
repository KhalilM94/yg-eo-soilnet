# Builds the documentation and publishes it as a website, so it can be read as pages in a browser
# rather than as Markdown files in the repository.
#
# The site appears at https://khalilm94.github.io/yg-eo-soilnet/ and is rebuilt on every change to
# main. It needs one setting on the repository, once: Settings -> Pages -> Source: GitHub Actions.
name: Documentation

on:
  push:
    branches: [main]
  # Also buildable by hand, for checking a rebuild without waiting for a change.
  workflow_dispatch:

permissions:
  contents: read
  # The two the publishing step needs, and nothing more.
  pages: write
  id-token: write

# One publish at a time. A run already going is left to finish rather than cancelled, so the
# published site is never left half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ci
          locked: true
          cache: true
          pixi-version: v0.58.0

      # The same command developers run by hand, warnings treated as errors, so the published site
      # cannot quietly drift from what the strict local build produces.
      - name: Build the documentation
        run: pixi run -e ci docs

      # How much of the code the tests actually run. Published beside the documentation as a
      # small file that shields.io reads, because a badge needs a number on the open web and this
      # is the only place the project publishes to. The whole suite runs here, not the quick
      # subset, so the figure covers everything.
      - name: Measure how much of the code the tests cover
        run: |
          pixi run -e ci python -m pytest --cov=yg_eo_soilnet ./tests -q
          pixi run -e ci python -m coverage json -o coverage-raw.json

      - name: Write the coverage badge
        run: |
          pixi run -e ci python - <<'PY'
          import json, pathlib
          total = json.load(open("coverage-raw.json"))["totals"]["percent_covered"]
          colour = ("brightgreen" if total >= 90 else "green" if total >= 80
                    else "yellow" if total >= 60 else "red")
          badge = {"schemaVersion": 1, "label": "coverage",
                   "message": f"{total:.0f}%", "color": colour}
          pathlib.Path("docs/_build/html/coverage.json").write_text(json.dumps(badge))
          print("coverage:", badge["message"])
          PY

      - uses: actions/configure-pages@v6

      - name: Package the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
