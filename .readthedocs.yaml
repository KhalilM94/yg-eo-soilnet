# Settings for publishing the documentation on readthedocs.org (optional).
# The site builds locally with `pixi run -e dev docs`; this file is only read by Read the Docs.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # The heavy libraries (PyTorch, MLflow, ...) are not installed there and are replaced by
  # stand-ins, which can produce harmless warnings. The local build is the strict one.
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
