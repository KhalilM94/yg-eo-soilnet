[project]
authors = [{name = "KhalilM94", email = "khalil.misbah@protonmail.com"}]
license = "MIT"
name = "yg-eo-soilnet"
requires-python = ">= 3.12,<3.13"
version = "0.1.0"
readme = "README.md"
dependencies = ["mlflow==3.14.*", "psutil>=7.2.2,<8", "pip>=26.1.2,<27", "ipykernel>=7.3.0,<8", "clhs>=1.0.2,<2"]

[project.urls]
Homepage = "https://github.com/KhalilM94/yg-eo-soilnet"
Repository = "https://github.com/KhalilM94/yg-eo-soilnet.git" 

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/yg_eo_soilnet"]

[tool.pixi.workspace]
channels = ["conda-forge", "main", "r", "msys2", "nvidia"]
name = "yg_eo_soilnet"
platforms = ["linux-64", "win-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[tool.pixi.pypi-dependencies]
yg_eo_soilnet = { path = ".", editable = true }

[tool.pixi.feature.prod-core.dependencies]
python = ">=3.12,<3.13"
scikit-learn = ">=1.9.0,<2"
shap = "*"
pyproj = ">=3.7.2,<4"
numpy = ">=2.0,<2.3"
geopandas = ">=1.1.4,<2"
matplotlib = ">=3.11.0,<4"
scipy = ">=1.13.0,<2"
pandas = "<3"
pytorch = ">=2.12.1,<3"
lightning = ">=2.4.0,<3"
optuna = ">=4.0,<5"
tqdm = ">=4.57,<5"
seaborn = ">=0.13.2,<0.14"
xarray = ">=2024.3.0,<2026"

# TabICL is not on conda-forge, so it has to come from PyPI. It belongs to prod-core rather than
# the workspace-wide [tool.pixi.pypi-dependencies] because prod-core is what carries the conda
# pytorch that satisfies its torch>=2.2 - the implicit `default` environment has no conda pytorch,
# so putting it at workspace level drags a torch wheel plus the whole nvidia_* CUDA stack into the lock.
[tool.pixi.feature.prod-core.pypi-dependencies]
tabicl = ">=2.1.1,<3"

[tool.pixi.feature.gpu-backend.system-requirements]
cuda = "12.0"

[tool.pixi.feature.gpu-backend.target.linux-64.pypi-dependencies]
xgboost = ">=3.3.0, <4"

[tool.pixi.feature.gpu-backend.target.win-64.pypi-dependencies]
xgboost = ">=3.3.0, <4"

[tool.pixi.environments]
core = { features = ["prod-core", "cpu-backend"], solve-group = "default" }
core-gpu = { features = ["prod-core", "gpu-backend"], solve-group = "default" }
dev = { features = ["prod-core", "gpu-backend", "dev"], solve-group = "core-gpu" }
explore = { features = ["prod-core", "cpu-backend", "explore"]}

# Tasks every environment can run (core, core-gpu, dev, explore).
[tool.pixi.tasks]
# Opens the MLflow results browser at http://127.0.0.1:5000
mlflow = { cmd = "mlflow ui", env = { MLFLOW_ALLOW_FILE_STORE = "true" } }
# A small made-up dataset, and a full pipeline run on it - see the Quickstart in README.md.
demo-data = "python examples/make_demo_data.py"
demo = "python main.py --config-path examples/demo_config/main_config.yml"

[tool.pixi.feature.dev.tasks]
dev-env = "pixi shell -e dev"
test = "pytest ./tests"
# Everything but the tests marked slow (a subprocess, a numba compile, end-to-end sklearn training).
test-fast = "pytest -m 'not slow' ./tests"
test-with-cov = "pytest --cov=yg_eo_soilnet tests/"
# Runs the ">>>" examples written inside the docstrings, so they cannot drift from the code.
doctest = "pytest --doctest-modules src/yg_eo_soilnet config.py main.py"
lint = "ruff check"
# Builds the documentation website into docs/_build/html; any warning fails the build.
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"

[tool.pixi.feature.explore.tasks]
notebook = "jupyter lab"

[tool.pixi.feature.cpu-backend.dependencies]
py-xgboost = ">=3.3.0,<4"

[dependency-groups]
explore = ["jupyterlab", "scikit-gstat", "pykrige", "xarray"]
test = ["pytest", "ruff", "pytest-cov"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]
dev = [{include-group = "test"}, {include-group = "docs"}]


[tool.ruff]
extend-exclude = ["notebooks"]
# The width the code is already written to by hand. The tool's own default is 88, which would
# rewrap most lines in the project for no reason other than the default.
line-length = 120

[tool.ruff.lint]
# D1: every public module, class, method and function must have a docstring.
extend-select = ["D1"]
# __init__ and magic methods are described in their class docstring (NumPy convention).
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
# Registered because warnings are errors: an unknown mark would fail collection.
markers = [
    "slow: seconds-long by nature (subprocess, numba compile, end-to-end training); deselect with -m 'not slow'",
]
# Warnings are errors so a new one from our own code fails the suite instead of scrolling past.
# Each ignore below is a third-party warning we cannot act on; keep the reason with the pattern.
filterwarnings = [
    "error",
    # Lightning: the checkpoint tests pin accelerator="cpu" deliberately on a CUDA box.
    'ignore:GPU available but not used:',
    # Lightning internals still call the deprecated pytree LeafSpec API.
    'ignore:.*LeafSpec.*:',
    # Perf hint only; the tiny test datamodules intentionally use num_workers=0.
    'ignore:.*does not have many workers.*:',
    # torch probing CUDA in this environment.
    "ignore:Can't initialize NVML:",
    # Optuna marks its matplotlib plotting helpers experimental. They are the only backend we can
    # use (the default one needs plotly, which is not installed), so the warning is not actionable.
    "ignore::optuna.exceptions.ExperimentalWarning",
    # shap 0.48 builds its colormaps with the pre-3.11 matplotlib API. Raised at import time, from
    # library code we do not control, and unrelated to anything this project calls.
    "ignore:The set_bad function will be deprecated:PendingDeprecationWarning",
    "ignore:The set_over function will be deprecated:PendingDeprecationWarning",
    "ignore:The set_under function will be deprecated:PendingDeprecationWarning",
    # mlflow.pyfunc emits these from its OWN module-level code the moment it is imported - they are
    # about mlflow's type-hint-based validation, which the sequence pyfunc does not use (its schema
    # comes from an explicit signature built from a real input example).
    "ignore:.*Any type hint is inferred as AnyType.*:UserWarning",
    "ignore:.*Union type hint with multiple non-None types.*:UserWarning",
]
